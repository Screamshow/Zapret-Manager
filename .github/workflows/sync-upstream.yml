name: Sync upstream

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge StressOzz main
        run: |
          git config user.name "Screamshow upstream sync"
          git config user.email "235684779+Screamshow@users.noreply.github.com"
          git remote add upstream https://github.com/StressOzz/Zapret-Manager.git
          git fetch upstream main
          # This fork keeps local launcher and documentation changes that overlap
          # upstream. Prefer those on conflict so scheduled syncs remain non-blocking.
          git merge --no-edit -X ours upstream/main
          git push origin main
